[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cwglitch"
version = "0.1.0"
description = "Simulate continuous gravitational-wave signals with pulsar glitches using LALSuite"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "pydantic>=2",
    "tqdm",
    "lalsuite",
    "solar-system-ephemerides>=1.2.0",
]

[project.scripts]
cwglitch = "cwglitch.cli:main"

[tool.setuptools.packages.find]
include = ["cwglitch*"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.17.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
